      const [currentQIndex, setCurrentQIndex] = useState(0);

        if (appTopRef.current) {

        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      // Sempre que mudar de pergunta ou de estágio, rola para o topo
      useEffect(() => {
        scrollToTop();
      }, [stage, currentQIndex]);

      // Carregar histórico local
      useEffect(() => {
        try {
          const saved = localStorage.getItem('bussola_terapeuta_save_v2');
          if (saved) {
            const data = JSON.parse(saved);
            if (data.answers && Object.keys(data.answers).length >= 4) {
              setAnswers(data.answers);
              setCalculatedArchetypeKey(data.archetypeKey || 'prisioneira_relogio');
            }
          }
        } catch (e) {
          console.warn('Storage indisponível');
        }
      }, []);

      const saveProgress = (ans, archKey) => {
        try {
          localStorage.setItem('bussola_terapeuta_save_v2', JSON.stringify({
            answers: ans,
            archetypeKey: archKey,
            updatedAt: new Date().toISOString()
          }));
        } catch (e) {}
      };

      const handleSelectOption = (questionId, optionId) => {
        const nextAnswers = { ...answers, [questionId]: optionId };
        setAnswers(nextAnswers);

        if (currentQIndex < diagnosticQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
        } else {
          const finalArchetype = evaluateArchetype(nextAnswers);
          setCalculatedArchetypeKey(finalArchetype);
          saveProgress(nextAnswers, finalArchetype);
          setStage('result');
        }
        scrollToTop();
      };

      const handlePreviousQuestion = () => {
        if (currentQIndex > 0) {
          setCurrentQIndex(prev => prev - 1);
        } else {
          setStage('intro');
        }
        scrollToTop();
      };

      const handleRestart = () => {
        setAnswers({});
        setCurrentQIndex(0);
        setStage('intro');
        scrollToTop();
        try {
          localStorage.removeItem('bussola_terapeuta_save_v2');
        } catch (e) {}
      };

      // Avaliação Refinada com 6 Variáveis
      const evaluateArchetype = (ans) => {
        const r1 = ans['sustentacao'];
        const r2 = ans['esgotamento_corpo'];
        const r3 = ans['repeticao_saberes'];
        const r4 = ans['gargalo_criativo'];
        const r5 = ans['visao_ia'];
        const r6 = ans['visao_futuro'];

        if (r1 === 'refem_1a1' && (r2 === 'exaustao_emocional' || r6 === 'renda_independente')) {
          return 'prisioneira_relogio';
        }
        if (r1 === 'ideias_gaveta' || r4 === 'tempo_estruturacao' || r3 === 'tudo_intuitivo') {
          return 'guardia_gaveta';
        }
        return 'arquiteta_ecossistema';
      };

      const activeArchetype = useMemo(() => {
        return archetypesConfig[calculatedArchetypeKey] || archetypesConfig.prisioneira_relogio;
      }, [calculatedArchetypeKey]);

      const currentQuestion = diagnosticQuestions[currentQIndex];
      const progressPercent = Math.round(((currentQIndex + 1) / diagnosticQuestions.length) * 100);

        if (e) e.preventDefault();
        
        const messageText = `Olá! 🌸 Vim através do mini-app "Bússola da Terapeuta Digital" no Flor em Teu Ser.

Acabei de concluir meu diagnóstico e o meu momento atual deu:
👉 *${activeArchetype.title}*

Senti muito chamado pelo que você compartilhou sobre ir além do 1:1 com IA e gostaria de conversar sobre o meu próximo passo!`;

        const encodedMsg = encodeURIComponent(messageText);

        const targetUrl = `https://api.whatsapp.com/send?phone=${WHATSAPP_PHONE}&text=${encodedMsg}`;

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

          window.location.href = targetUrl;
        } else {
          window.open(targetUrl, '_blank', 'noopener,noreferrer');
        }

        document.body.appendChild(el);
        el.select();

          document.execCommand('copy');
          setCopiedText(true);
          setTimeout(() => setCopiedText(false), 3000);
        } catch (err) {}
        document.body.removeChild(el);

              </div>

              <div className="h-36 sm:h-44 w-full relative flex items-center justify-between overflow-hidden bg-parchment-200">
                <img 
                  src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=1200&q=80" 
                  alt="Espaço terapêutico acolhedor com luz natural, plantas e aconchego"
                  className="absolute inset-0 w-full h-full object-cover object-center transition-transform duration-700 ease-out group-hover:scale-105"
                  onError={(e) => {
                    e.currentTarget.src = "https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?auto=format&fit=crop&w=1200&q=80";
                  }}
                />

                <div className="absolute inset-0 bg-gradient-to-r from-stone-900/85 via-stone-900/65 to-transparent sm:to-stone-900/20 backdrop-blur-[0.5px]"></div>

                <div className="relative z-10 px-5 sm:px-7 max-w-[280px] sm:max-w-sm text-left text-white">
                  <span className="inline-block text-[10px] uppercase font-bold tracking-widest text-emerald-200 bg-stone-900/60 backdrop-blur-md px-2.5 py-0.5 rounded-full border border-white/15 mb-1.5">
                    Além da Troca de Horas
                  </span>
                  <h2 className="text-sm sm:text-base font-serif font-medium text-white leading-snug drop-shadow-sm">
                    Sua sabedoria merece florescer em novos formatos.
                  </h2>
                  <p className="text-[11px] text-stone-200/90 mt-1 leading-relaxed hidden sm:block">
                    Sem exaustão biológica. Sem fórmulas frias. Com presença e apoio da IA.
                  </p>
                </div>

                <div className="absolute right-3.5 bottom-3 z-10 hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-stone-900/60 backdrop-blur-md border border-white/10 text-[10px] text-stone-200">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span>Espaço de Cura & Expansão</span>
                </div>
              </div>
            </div>

            {/* ETAPA 1: TELA INICIAL (BOAS-VINDAS) */}
            {stage === 'intro' && (
              <div className="space-y-4 fade-step-enter">
                <div className="text-center space-y-2">
                  <h1 className="text-xl sm:text-2xl font-serif font-bold text-slate-800 leading-snug">
                    E se expandir não significasse atender mais horas no 1:1 até a exaustão?
                  </h1>
                  <p className="text-xs sm:text-sm text-slate-600 max-w-md mx-auto leading-relaxed">
                    Muitas terapeutas já atendem no presencial ou no digital, mas continuam <strong>reféns do relógio e da troca de tempo por dinheiro</strong>. Descubra como a Inteligência Artificial ética destrava novos formatos com alma.
                  </p>
                </div>

                {/* 3 Cartões Rápidos do Mini-App */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
                  <div className="p-3 bg-white rounded-xl border border-parchment-200 flex items-center gap-2.5 shadow-xs">
                    <span className="text-base">⏳</span>
                    <div className="text-[11px] text-slate-700 font-medium">Fim do teto biológico da sessão</div>
                  </div>
                  <div className="p-3 bg-white rounded-xl border border-parchment-200 flex items-center gap-2.5 shadow-xs">
                    <span className="text-base">🌿</span>
                    <div className="text-[11px] text-slate-700 font-medium">Saberes empacotados em produtos</div>
                  </div>
                  <div className="p-3 bg-white rounded-xl border border-parchment-200 flex items-center gap-2.5 shadow-xs">
                    <span className="text-base">✨</span>
                    <div className="text-[11px] text-slate-700 font-medium">IA como co-criadora empática</div>
                  </div>
                </div>

                <div className="p-3.5 rounded-xl bg-sage-50/70 border border-sage-200/70 text-center text-xs text-sage-900 leading-relaxed">
                  <strong>6 Perguntas Guiadas de Reflexão:</strong> Responda com honestidade para diagnosticar seu momento exato e receber um roteiro de descompressão do 1:1.
                </div>

                <button
                  onClick={() => setStage('quiz')}
                  className="w-full py-3.5 px-5 rounded-2xl bg-clay-600 hover:bg-clay-700 text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-lg shadow-clay-600/20 transition-all duration-300 hover:scale-[1.01] active:scale-95"
                >
                  Iniciar Diagnóstico do Meu Momento <ArrowRight className="w-4 h-4" />
                </button>

                {answers['sustentacao'] && (
                  <div className="text-center pt-1">
                    <button
                      onClick={() => setStage('result')}
                      className="text-xs text-clay-700 hover:text-clay-900 underline font-medium"
                    >
                      Acessar meu último resultado salvo
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* ETAPA 2: O QUIZ DE 6 PERGUNTAS */}
            {stage === 'quiz' && (
              <div className="space-y-4 fade-step-enter">
                
                {/* Indicador de Progresso do Mini-App */}
                <div className="space-y-1.5 pb-1">
                  <div className="flex items-center justify-between text-[11px] font-semibold text-slate-600">
                    <span className="text-sage-800 bg-sage-100/80 px-2.5 py-0.5 rounded-md">
                      {currentQuestion.stageTitle}
                    </span>
                    <span className="font-mono text-clay-700 font-bold">
                      {progressPercent}%
                    </span>
                  </div>
                  <div className="w-full bg-parchment-200 h-1.5 rounded-full overflow-hidden">
                    <div 
                      className="bg-clay-500 h-full rounded-full transition-all duration-300 ease-out"
                      style={{ width: `${progressPercent}%` }}
                    />
                  </div>
                </div>

                {/* Título da Pergunta Atual */}
                <div className="space-y-1">
                  <h2 className="text-base sm:text-lg font-serif font-semibold text-slate-900 leading-snug">
                    {currentQuestion.headline}
                  </h2>
                  <p className="text-[11px] sm:text-xs text-slate-500">
                    {currentQuestion.subtitle}
                  </p>
                </div>

                {/* Lista de Opções Clicáveis */}
                <div className="space-y-2 pt-1">
                  {currentQuestion.options.map((option) => {
                    const isSelected = answers[currentQuestion.id] === option.id;
                    return (
                      <button
                        key={option.id}
                        onClick={() => handleSelectOption(currentQuestion.id, option.id)}
                        className={`w-full p-3.5 rounded-2xl border text-left transition-all duration-200 group flex items-start gap-3 ${
                          isSelected
                            ? 'border-clay-500 bg-clay-50/90 shadow-xs'
                            : 'border-parchment-200 bg-white hover:border-clay-300 hover:bg-clay-50/30'
                        }`}
                      >
                        <span className="text-xl shrink-0 p-1 bg-parchment-100 rounded-xl group-hover:scale-105 transition-transform">
                          {option.icon}
                        </span>
                        <div className="flex-1">
                          <h4 className="text-xs sm:text-sm font-semibold text-slate-800 group-hover:text-clay-800 transition-colors">
                            {option.title}
                          </h4>
                          <p className="text-[11px] text-slate-500 mt-0.5 leading-relaxed">
                            {option.desc}
                          </p>
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* Botão de Retorno de Pergunta */}
                <div className="flex items-center justify-between pt-2 border-t border-parchment-200/60">
                  <button
                    onClick={handlePreviousQuestion}
                    className="inline-flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-800 font-medium px-2.5 py-1.5 rounded-lg hover:bg-parchment-100 transition-colors"
                  >
                    <ArrowLeft className="w-3.5 h-3.5" /> Voltar anterior
                  </button>
                  <span className="text-[11px] text-slate-400">
                    Passo {currentQIndex + 1} de {diagnosticQuestions.length}
                  </span>
                </div>

              </div>
            )}

            {/* ETAPA 3: RESULTADO & CONEXÃO (WHATSAPP E DIRECT) */}
            {stage === 'result' && (
              <div className="space-y-4 fade-step-enter">
                
                {/* Cartão do Arquétipo */}
                <div className="p-5 rounded-2xl bg-gradient-to-br from-white via-clay-50/70 to-parchment-100/50 border-2 border-clay-200 shadow-sm relative overflow-hidden">
                  <div className="flex items-center justify-between gap-2 pb-2.5 border-b border-clay-200/60">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-clay-700 bg-clay-100 px-2.5 py-0.5 rounded-full">
                      {activeArchetype.archetypeBadge}
                    </span>
                    <span className="text-[11px] font-medium text-slate-500">
                      Diagnóstico Concluído
                    </span>
                  </div>

                  <div className="pt-3 space-y-1.5">
                    <h2 className="text-lg sm:text-xl font-serif font-bold text-slate-900 leading-snug">
                      {activeArchetype.title}
                    </h2>
                    <p className="text-xs text-slate-700 leading-relaxed font-medium">
                      {activeArchetype.resumo}
                    </p>
                  </div>
                </div>

                {/* O Ponto Cego */}
                <div className="p-4 rounded-xl bg-amber-50/80 border border-amber-200/80 space-y-1.5">
                  <div className="flex items-center gap-1.5 text-amber-900 text-xs font-bold uppercase tracking-wider">
                    <ShieldAlert className="w-4 h-4 text-amber-600 shrink-0" />
                    <span>Seu Maior Ponto Cego Hoje</span>
                  </div>
                  <p className="text-xs text-amber-900/90 leading-relaxed">
                    {activeArchetype.pontoCego}
                  </p>
                </div>

                {/* Como a IA Desbloqueia */}
                <div className="p-4 rounded-xl bg-sage-50/90 border border-sage-200 space-y-1.5">
                  <div className="flex items-center gap-1.5 text-sage-900 text-xs font-bold uppercase tracking-wider">
                    <Sparkles className="w-4 h-4 text-sage-600 shrink-0" />
                    <span>A Chave de Alquimia com IA para Você</span>
                  </div>
                  <p className="text-xs text-slate-700 leading-relaxed">
                    {activeArchetype.ondeIaDestrava}
                  </p>
                </div>

                {/* Roteiro Prático de 3 Passos */}
                <div className="p-4 rounded-xl bg-white border border-parchment-200 space-y-2.5 shadow-xs">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
                    <Layers className="w-3.5 h-3.5 text-clay-600" />
                    <span>Roteiro de Descompressão Recomendado:</span>
                  </h3>

                  <div className="space-y-2">
                    {activeArchetype.planoDe3Passos.map((item, idx) => (
                      <div key={idx} className="p-2.5 rounded-lg bg-parchment-50 border border-parchment-200 flex items-start gap-2.5">
                        <span className="text-[11px] font-mono font-bold px-1.5 py-0.5 rounded bg-clay-100 text-clay-800 shrink-0">
                          {item.step}
                        </span>
                        <div>
                          <h4 className="text-xs font-semibold text-slate-800">{item.title}</h4>
                          <p className="text-[11px] text-slate-600 mt-0.5 leading-relaxed">{item.desc}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* CAIXA DE ACOLHIMENTO: WHATSAPP OU DIRECT */}
                <div className="p-5 rounded-2xl bg-gradient-to-br from-clay-50/90 via-white to-parchment-100 border border-clay-200 text-center space-y-3 shadow-sm">
                  <div className="inline-block px-2.5 py-0.5 rounded-full bg-clay-100 text-clay-700 font-bold text-[10px] uppercase tracking-wider">
                    🌸 Próximo Passo • Conversa Direta
                  </div>

                  <div className="space-y-1 max-w-sm mx-auto">
                    <h3 className="text-sm sm:text-base font-serif font-bold text-slate-900">
                      Quer me contar o seu resultado e pensar no próximo passo?
                    </h3>
                    <p className="text-[11px] text-slate-600 leading-relaxed">
                      Adorarei te ouvir de forma personalizada. Me envie uma mensagem contando seu diagnóstico para pensarmos no formato ideal para o seu momento.
                    </p>
                  </div>

                  {/* Botões de Contato */}
                  <div className="pt-1 flex flex-col sm:flex-row gap-2.5 justify-center items-center">
                    
                    {/* Botão WhatsApp Robusto e Compatível com Mobile */}
                    <button
                      type="button"
                      onClick={handleOpenWhatsapp}
                      className="w-full sm:w-auto inline-flex items-center justify-center gap-2 py-3 px-5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-md shadow-emerald-600/20 transition-all hover:scale-[1.02] active:scale-95 cursor-pointer"
                    >
                      <MessageCircle className="w-4 h-4" />
                      <span>Falar no WhatsApp com meu resultado</span>
                    </button>

                    {/* Botão Instagram Direct */}
                    <a
                      href="https://instagram.com/floremteuser" 
                      target="_blank"
                      rel="noreferrer"
                      onClick={copyInstagramText}
                      className="w-full sm:w-auto inline-flex items-center justify-center gap-2 py-3 px-5 rounded-xl bg-gradient-to-r from-purple-600 via-pink-600 to-rose-500 hover:opacity-95 text-white text-xs font-semibold shadow-md shadow-pink-500/15 transition-all hover:scale-[1.02] active:scale-95"
                    >
                      <Instagram className="w-4 h-4" />
                      <span>{copiedText ? 'Texto Copiado! Abrindo @floremteuser' : 'Falar no Direct (@floremteuser)'}</span>
                    </a>

                  </div>

                  {copiedText && (
                    <p className="text-[11px] text-emerald-700 bg-emerald-50 py-1 px-3 rounded-lg border border-emerald-200 inline-block font-medium fade-step-enter">
                      ✓ Mensagem copiada com sucesso! Ao abrir o Instagram, basta colar na DM.
                    </p>
                  )}

                  <div className="pt-1">
                    <button
                      onClick={handleRestart}
                      className="inline-flex items-center gap-1 text-[11px] text-slate-500 hover:text-slate-800 font-medium py-1 px-2.5 rounded-lg hover:bg-white transition-colors"
                    >
                      <RotateCcw className="w-3 h-3" /> Refazer diagnóstico do zero
                    </button>
                  </div>
                </div>

              </div>
            )}

          </div>

          {/* BARRA DE NAVEGAÇÃO ESTILO MINI-APP FIXA NO RODAPÉ */}
          <nav className="sticky bottom-2 mt-2 w-full max-w-xl mx-auto rounded-2xl bg-white/95 backdrop-blur-md border border-parchment-200 shadow-lg shadow-slate-900/5 p-2 flex items-center justify-around z-30">
            <button
              onClick={() => setStage('intro')}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-[10px] font-medium ${
                stage === 'intro' ? 'text-clay-700 font-bold bg-clay-50' : 'text-slate-500 hover:text-slate-800'
              }`}
            >
              <Home className="w-4 h-4" />
              <span>Início</span>
            </button>

            <button
              onClick={() => {
                if (stage === 'intro') setStage('quiz');
              }}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-[10px] font-medium ${
                stage === 'quiz' ? 'text-clay-700 font-bold bg-clay-50' : 'text-slate-500 hover:text-slate-800'
              }`}
            >
              <Activity className="w-4 h-4" />
              <span>Perguntas</span>
            </button>

            <button
              onClick={() => {
                if (Object.keys(answers).length >= 4) {
                  setStage('result');
                }
              }}
              disabled={Object.keys(answers).length < 4 && stage !== 'result'}
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-[10px] font-medium ${
                stage === 'result'
                  ? 'text-clay-700 font-bold bg-clay-50' 
                  : Object.keys(answers).length >= 4 
                    ? 'text-slate-700 hover:text-slate-900' 
                    : 'text-slate-300 cursor-not-allowed'
              }`}
            >
              <Compass className="w-4 h-4" />
              <span>Diagnóstico</span>
            </button>

            <button
              onClick={handleOpenWhatsapp}
              className="flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-[10px] font-medium text-emerald-700 hover:bg-emerald-50 transition-colors cursor-pointer"
            >
              <MessageCircle className="w-4 h-4 text-emerald-600" />
              <span>WhatsApp</span>
            </button>
          </nav>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
